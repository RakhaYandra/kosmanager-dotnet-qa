name: qa
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    # Kredensial di bawah itu throwaway: service container MySQL dibuat fresh per
    # run lalu dibuang. Tidak ada data sensitif yang bisa bocor darinya.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: kosmanager
          MYSQL_USER: kos
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports: ["3308:3306"]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      MYSQL_PASSWORD: ci-dummy-password
      MYSQL_ROOT_PASSWORD: ci-dummy-root
      JWT_SECRET: "ci-dummy-secret-min-32-karakter-aman"
      NOTIFY_CHANNEL: mock
      EXPECTED_REQUESTS: "25"
    steps:
      - uses: actions/checkout@v4
        with: { repository: RakhaYandra/kosmanager-dotnet, path: api-src }
      - uses: actions/checkout@v4
        with: { path: qa }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet tool install -g dotnet-ef --version 8.0.13
      - run: dotnet ef database update --project KosManager.Infrastructure --startup-project KosManager.Api
        working-directory: api-src
        env:
          DB_CONN: "server=127.0.0.1;port=3308;database=kosmanager;user=kos;password=${{ env.MYSQL_PASSWORD }}"
      - run: mysql -h127.0.0.1 -P3308 -ukos -p"$MYSQL_PASSWORD" kosmanager < KosManager.Api/seed/seed.sql
        working-directory: api-src
      - run: dotnet build KosManager.Api
        working-directory: api-src
      - run: dotnet KosManager.Api/bin/Debug/net8.0/KosManager.Api.dll --urls http://localhost:8090 &
        working-directory: api-src
        env:
          DB_CONN: "server=127.0.0.1;port=3308;database=kosmanager;user=kos;password=${{ env.MYSQL_PASSWORD }}"
      - run: |
          for i in $(seq 1 20); do curl -sf http://localhost:8090/healthz && break || sleep 5; done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml openpyxl
      # reports/ is gitignored, so it does not exist in a fresh checkout.
      - run: mkdir -p reports
      - run: npx --yes newman run ${{ github.workspace }}/api-src/KosManager.Api/api/postman_collection.json --env-var baseUrl=http://localhost:8090 --reporters cli,json --reporter-json-export newman.json
        working-directory: qa/reports
      # Gate: klaim "25/25" di README harus selalu punya bukti di run ini.
      - name: gate newman
        run: |
          set -euo pipefail
          total=$(jq -r '.run.stats.requests.total' reports/newman.json)
          failed=$(jq -r '.run.stats.requests.failed' reports/newman.json)
          echo "newman: $((total - failed))/$total"
          [ "$failed" -eq 0 ] || { echo "::error::$failed request(s) failed"; exit 1; }
          [ "$total" -eq "$EXPECTED_REQUESTS" ] || {
            echo "::error::collection punya $total request, README mengklaim $EXPECTED_REQUESTS — sinkronkan README atau collection"; exit 1; }
      - run: npm install --no-audit --no-fund && npx playwright test
        working-directory: qa/e2e
      - run: python3 tools/generate-report.py
        working-directory: qa
      # Bukti dipublish sebagai artifact, bukan di-commit (report berisi token).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: |
            qa/reports/newman.json
            qa/reports/playwright.json
            qa/reports/KosManager-QA-Report.xlsx
          retention-days: 30
